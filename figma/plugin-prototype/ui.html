<!doctype html>
<meta charset="utf-8">
<style>
  body{font:13px/1.5 system-ui,sans-serif;margin:0;padding:16px;color:#15171B}
  h1{font-size:15px;margin:0 0 10px}
  pre{white-space:pre-wrap;background:#F4F2ED;border-radius:8px;padding:12px;max-height:250px;overflow:auto;margin:0 0 12px}
  button{background:#E11D33;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 13px system-ui;cursor:pointer}
</style>
<h1>EventGo — liens du prototype</h1>
<pre id="out">Création des liens en cours…</pre>
<button id="ok">Fermer</button>
<script>
  onmessage = function (e) { var m = e.data.pluginMessage; if (m && m.type === 'report') document.getElementById('out').textContent = m.text; };
  document.getElementById('ok').onclick = function () { parent.postMessage({ pluginMessage: { type: 'close' } }, '*'); };
</script>
